<title>TITULO_CURTO</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* Painel de leitura: filtro de período no topo, KPIs, grade de painéis interativos. */
  :root {
    --bg: #f5f7f8; --surface: #ffffff; --fg: #14232b; --muted: #5b6b73;
    --line: #dde4e7; --grid: #eaeff1;
    --accent: #0f7c8c; --accent-soft: #d3ecef; --accent-2: #6a5acd; --accent-2-soft: #e4e0fa;
    --good: #1d8a4e; --warn: #b26a00; --warn-soft: #fbf0dc; --bad: #c23b3b; --bad-soft: #f7e0e0;
    --focus: #0f7c8c;
    --font-display: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-data: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    --ease: cubic-bezier(.22, .61, .36, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e171b; --surface: #152227; --fg: #e4ecef; --muted: #93a4ab;
      --line: #26363d; --grid: #1e2c32;
      --accent: #4cc3d2; --accent-soft: #173a40; --accent-2: #a89cf0; --accent-2-soft: #2a2545;
      --good: #4cc488; --warn: #e8a546; --warn-soft: #33281a; --bad: #ef7070; --bad-soft: #3a2222;
      --focus: #4cc3d2; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e171b; --surface: #152227; --fg: #e4ecef; --muted: #93a4ab;
    --line: #26363d; --grid: #1e2c32;
    --accent: #4cc3d2; --accent-soft: #173a40; --accent-2: #a89cf0; --accent-2-soft: #2a2545;
    --good: #4cc488; --warn: #e8a546; --warn-soft: #33281a; --bad: #ef7070; --bad-soft: #3a2222;
    --focus: #4cc3d2; color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 400 15px/1.55 var(--font-body); -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1180px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 48px; display: flex; flex-direction: column; gap: 22px; }

  header.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 18px; flex-wrap: wrap; }
  h1 { font-family: var(--font-display); font-size: clamp(22px, 4vw, 28px); font-weight: 600; margin: 0 0 6px; letter-spacing: -.015em; text-wrap: balance; }
  .eyebrow { font-family: var(--font-data); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .sub { color: var(--muted); margin: 0; max-width: 62ch; }

  .seg { position: relative; display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; flex-shrink: 0; }
  .seg .pill { position: absolute; top: 3px; bottom: 3px; border-radius: 7px; background: var(--accent-soft); border: 1px solid var(--accent); transition: transform .34s var(--ease), width .34s var(--ease); pointer-events: none; }
  .seg button { position: relative; font: 500 14px var(--font-body); color: var(--muted); background: none; border: 0; padding: 7px 15px; border-radius: 7px; cursor: pointer; transition: color .22s var(--ease); }
  .seg button[aria-pressed="true"] { color: var(--accent); font-weight: 600; }
  .seg button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; min-width: 0; animation: rise .5s var(--ease) backwards; }
  .kpi:nth-child(2) { animation-delay: .05s; } .kpi:nth-child(3) { animation-delay: .1s; } .kpi:nth-child(4) { animation-delay: .15s; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  .kpi .lbl { font-size: 13px; color: var(--muted); font-weight: 500; }
  .kpi .val { font-family: var(--font-data); font-size: 30px; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -.02em; line-height: 1.15; }
  .kpi .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); min-height: 22px; }

  .chip { font-family: var(--font-data); font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
  .chip.up { color: var(--good); } .chip.down { color: var(--bad); } .chip.flat { color: var(--muted); } .chip.na { color: var(--warn); }

  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 18px 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; animation: rise .5s var(--ease) backwards; }
  .panel.full { grid-column: 1 / -1; }
  .panel:nth-child(2) { animation-delay: .06s; } .panel:nth-child(3) { animation-delay: .12s; } .panel:nth-child(4) { animation-delay: .18s; }
  .panel h2 { font-family: var(--font-display); font-size: 17px; font-weight: 600; margin: 0; }
  .ph { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline; }
  .tot { font-family: var(--font-data); font-size: 12.5px; color: var(--muted); }

  .legend { display: flex; gap: 8px; flex-wrap: wrap; font-size: 12.5px; }
  .legend button { display: inline-flex; align-items: center; gap: 6px; font: 400 12.5px var(--font-body); color: var(--muted); background: none; border: 1px solid transparent; border-radius: 999px; padding: 2px 9px 2px 7px; cursor: pointer; transition: border-color .2s var(--ease), color .2s var(--ease), opacity .2s var(--ease); }
  .legend button:hover { border-color: var(--line); color: var(--fg); }
  .legend button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .legend button[aria-pressed="false"] { opacity: .45; }
  .legend button[aria-pressed="false"] .swatch { background: transparent !important; }
  .swatch { width: 11px; height: 11px; border-radius: 3px; flex-shrink: 0; transition: background .2s var(--ease); }
  .swatch.ring { border-radius: 999px; }

  .chart { position: relative; width: 100%; touch-action: pan-y; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; border-radius: 8px; }

  .sel-col { fill: var(--accent-soft); opacity: .55; transition: transform .34s var(--ease), opacity .25s var(--ease); }
  .hit { fill: transparent; cursor: pointer; }
  .draw { transition: stroke-dashoffset 1.05s var(--ease); }
  .fade { transition: opacity .5s var(--ease) .25s; }
  .grow { transition: transform .7s var(--ease), opacity .4s var(--ease); }
  .serie { transition: opacity .28s var(--ease); }
  .serie[data-off="1"] { opacity: 0; pointer-events: none; }
  .crosshair { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; opacity: 0; transition: opacity .15s var(--ease); pointer-events: none; }
  .crosshair.on { opacity: .6; }

  .tip { position: absolute; pointer-events: none; z-index: 3; background: var(--fg); color: var(--bg); font: 12px/1.45 var(--font-data); padding: 7px 10px; border-radius: 7px; white-space: nowrap; transform: translate(-50%, -112%); opacity: 0; transition: opacity .14s var(--ease), transform .18s var(--ease); }
  .tip.on { opacity: 1; }
  .tip b { font-weight: 500; } .tip .k { opacity: .7; }

  .note { font-size: 13px; color: var(--muted); margin: 0; }
  .flag { background: var(--warn-soft); color: var(--fg); border-radius: 8px; padding: 9px 12px; font-size: 13px; display: flex; gap: 8px; }
  .flag b { color: var(--warn); }

  .steps { display: flex; flex-direction: column; gap: 6px; }
  .step { display: grid; grid-template-columns: 78px 1fr 52px; gap: 10px; align-items: center; font-size: 13px; }
  .step .bar { height: 10px; background: var(--grid); border-radius: 5px; overflow: hidden; }
  .step .bar span { display: block; height: 100%; background: var(--bad); opacity: .8; border-radius: 5px; width: 0; transition: width .85s var(--ease) .3s; }
  .step .n { font-family: var(--font-data); text-align: right; font-variant-numeric: tabular-nums; }

  .tbtn { align-self: flex-start; font: 400 12px var(--font-body); color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; cursor: pointer; transition: color .2s var(--ease), border-color .2s var(--ease); }
  .tbtn:hover { color: var(--fg); border-color: var(--muted); }
  .tbtn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .tbl { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 6px 9px; border-bottom: 1px solid var(--line); }
  th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
  td.num, th.num { text-align: right; font-family: var(--font-data); font-variant-numeric: tabular-nums; }

  footer { font-size: 12.5px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; border-top: 1px solid var(--line); padding-top: 14px; }

  @media (max-width: 880px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid { grid-template-columns: minmax(0, 1fr); } header.top { align-items: flex-start; } }
  @media (max-width: 420px) { .wrap { padding-inline: 16px; } .kpi .val { font-size: 25px; } .seg button { padding: 7px 11px; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; transition-duration: .01ms !important; } }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="titulo"></h1>
      <p class="sub" id="lede"></p>
    </div>
    <div class="seg" role="group" aria-label="Período" id="seg"><span class="pill" id="pill"></span></div>
  </header>
  <section class="kpis" id="kpis" aria-live="polite"></section>
  <section class="grid" id="paineis"></section>
  <footer id="rodape"></footer>
</div>

<script>
/* ============================================================================
   DADOS — a ÚNICA parte que muda a cada dashboard. Troque este bloco inteiro.
   Nada abaixo de "MOTOR" precisa ser editado.

   Regras: todo número vem da fonte declarada no rodapé; o que a fonte não
   responde recebe `null` e aparece como "sem dado", nunca como estimativa.
   ========================================================================= */
const DADOS = {
  eyebrow: "Produto · ambiente · dd/mm–dd/mm/aaaa",
  titulo: "A leitura principal, em uma frase",
  lede: "O que o recorte mostra e por que importa. Diga como interagir: escolha um período ou clique num ponto do gráfico.",

  periodos: ["Jan", "Fev", "Mar"],
  agregado: "Trimestre",

  kpis: [
    {
      rotulo: "Métrica principal",
      serie: [82, 82, 86],
      agregado: 83.2,
      casas: 0, casasAgregado: 1, sufixo: "%", unidadeDelta: " pp",
      notas: ["9,4% falharam", "7,7% falharam", "8,0% falharam"],
      notaAgregado: "8,2% falharam · 4,09M tentativas"
    },
    {
      rotulo: "Métrica sem série",
      serie: [null, null, null],
      agregado: 99.94, casas: 2, sufixo: "%",
      semDado: "indisponível em",
      notaAgregado: "comparativo: 99,62%"
    }
  ],

  paineis: [
    {
      titulo: "Painel de linhas",
      total: "total do período",
      min: 0, max: 100, ticks: [0, 25, 50, 75, 100], sufixo: "%",
      graficos: [{
        tipo: "linhas",
        series: [
          { chave: "ok", nome: "Taxa de sucesso", curto: "sucesso", valores: [82, 82, 86], cor: "--accent", area: true, marcador: "circulo", casas: 0 },
          { chave: "fail", nome: "Taxa de falha", curto: "falha", valores: [9.4, 7.7, 8.0], cor: "--bad", marcador: "quadrado", tracejado: "6 4", casas: 1 }
        ]
      }],
      nota: "Como ler o painel e o que ficou de fora."
    },
    {
      titulo: "Painel misto",
      total: "contexto do total",
      graficos: [
        { tipo: "barras", compacto: true, min: 0, max: 60, ticks: [0, 30, 60], sufixo: "k",
          series: [{ chave: "ini", nome: "Iniciados (mil)", valores: [56, 27, 22], cor: "--accent", casas: 0 }] },
        { tipo: "linhas", compacto: true, min: 0, max: 40, ticks: [0, 20, 40], sufixo: "%",
          series: [{ chave: "fim", nome: "Taxa de conclusão", curto: "conclusão", valores: [23, 21, 28], cor: "--accent-2", marcador: "quadrado", casas: 0 }] }
      ],
      ranking: {
        titulo: "Maiores abandonos · % dos inícios",
        itens: [{ rotulo: "Telefone", valor: 11.0 }, { rotulo: "Selfie", valor: 10.5 }, { rotulo: "Documento", valor: 10.3 }],
        casas: 1, sufixo: "%"
      }
    },
    {
      titulo: "Painel de dois pontos",
      total: "só duas leituras",
      aviso: { titulo: "Sem série.", texto: "Explique por que não há série e o que está sendo mostrado no lugar." },
      grafico: {
        tipo: "dumbbell",
        pontos: ["28/09", "29/09"], min: 94, max: 100.4, ticks: [94, 96, 98, 100], casas: 2, sufixo: "%",
        series: [
          { chave: "a", nome: "Android (82,1%)", valores: [99.84, 99.94], cor: "--accent", marcador: "circulo" },
          { chave: "b", nome: "iOS (17,9%)", valores: [95.29, 99.62], cor: "--accent-2", marcador: "quadrado" }
        ]
      },
      nota: "Eixo recortado e desenhado como pontos, não barras — diga isso sempre que recortar o eixo."
    }
  ],

  rodape: [
    "Fontes: de onde veio cada número, com data de extração e filtros aplicados.",
    "Ressalvas de comparabilidade: métrica que usa definição diferente da outra.",
    "O que ficou fora do escopo e não foi estimado."
  ]
};

/* ============================================================================
   MOTOR — não editar.
   ========================================================================= */
const NS = "http://www.w3.org/2000/svg";
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const P = DADOS.periodos;
let sel = P.length - 1;
const charts = [];

const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const nf = (v, d = 1) => Number(v).toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtV = (v, casas = 1, sufixo = "", prefixo = "") => prefixo + nf(v, casas) + sufixo;
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function node(tag, cls, html, parent) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  if (parent) parent.appendChild(e);
  return e;
}

document.getElementById("eyebrow").textContent = DADOS.eyebrow;
document.getElementById("titulo").textContent = DADOS.titulo;
document.getElementById("lede").textContent = DADOS.lede;
document.title = DADOS.tituloCurto || DADOS.titulo;

const seg = document.getElementById("seg");
P.forEach((p, i) => {
  const b = node("button", null, p, seg);
  b.type = "button"; b.dataset.m = String(i); b.setAttribute("aria-pressed", String(i === sel));
});
if (DADOS.agregado) {
  const b = node("button", null, DADOS.agregado, seg);
  b.type = "button"; b.dataset.m = "q"; b.setAttribute("aria-pressed", "false");
}

/* ---------- KPIs ---------- */
function delta(agora, antes, unidade) {
  if (antes == null || agora == null) return `<span class="chip flat">sem base</span>`;
  const d = +(agora - antes).toFixed(1);
  if (Math.abs(d) < 0.05) return `<span class="chip flat">estável</span>`;
  return `<span class="chip ${d > 0 ? "up" : "down"}">${d > 0 ? "+" : "−"}${nf(Math.abs(d))}${unidade || ""}</span>`;
}
function countUp(n, to, casas, sufixo, prefixo) {
  const from = parseFloat(n.dataset.v || "");
  n.dataset.v = to;
  if (reduce || !isFinite(from) || from === to) { n.textContent = fmtV(to, casas, sufixo, prefixo); return; }
  const t0 = performance.now();
  (function step(t) {
    const p = Math.min(1, (t - t0) / 520), e = 1 - Math.pow(1 - p, 3);
    n.textContent = fmtV(from + (to - from) * e, casas, sufixo, prefixo);
    if (p < 1) requestAnimationFrame(step);
  })(performance.now());
}
function kpis() {
  const box = document.getElementById("kpis");
  const q = sel === "q";
  if (!box.children.length) {
    box.innerHTML = DADOS.kpis.map(k => `<div class="kpi"><span class="lbl">${k.rotulo}</span><span class="val">—</span><span class="meta"></span></div>`).join("");
  }
  [...box.children].forEach((card, i) => {
    const k = DADOS.kpis[i];
    const valNode = card.querySelector(".val");
    const metaNode = card.querySelector(".meta");
    const valor = q ? (k.agregado ?? null) : (k.serie ? k.serie[sel] : null);
    const casas = q ? (k.casasAgregado ?? k.casas ?? 1) : (k.casas ?? 1);
    if (valor == null) {
      valNode.textContent = "—";
      delete valNode.dataset.v;
      metaNode.innerHTML = `<span class="chip na">${k.semDado || "sem dado"}${q ? "" : " " + P[sel]}</span>`;
      return;
    }
    countUp(valNode, valor, casas, k.sufixo || "", k.prefixo || "");
    if (q) {
      metaNode.innerHTML = (k.chipAgregado || "") + (k.notaAgregado ? `<span>${k.notaAgregado}</span>` : "");
    } else {
      const antes = sel > 0 && k.serie ? k.serie[sel - 1] : null;
      const nota = k.notas && k.notas[sel] ? `<span>${k.notas[sel]}</span>` : "";
      metaNode.innerHTML = delta(valor, antes, k.unidadeDelta) + nota;
    }
  });
}

/* ---------- gráfico por período ---------- */
function periodChart(box, g, painel) {
  const temRotulo = (g.series || []).some(s => s.curto);
  const W = 520, H = g.compacto ? 150 : 215, L = 46, R = temRotulo ? 62 : 16, T = 14, B = 30;
  const min = g.min ?? painel.min ?? 0, max = g.max ?? painel.max ?? 100;
  const ticks = g.ticks || painel.ticks || [min, max];
  const sufixo = g.sufixo ?? painel.sufixo ?? "";
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, "aria-hidden": "true" }, box);
  const n = P.length, cw = (W - L - R) / n;
  const cx = i => L + cw * i + cw / 2;
  const y = v => T + (H - T - B) * (1 - (v - min) / (max - min));

  const selRect = el("rect", { x: 0, y: T, width: Math.max(0, cw - 8), height: H - T - B, rx: 6, class: "sel-col",
    transform: `translate(${L + cw * (typeof sel === "number" ? sel : 0) + 4} 0)` }, svg);

  ticks.forEach(tv => {
    el("line", { x1: L, x2: W - R, y1: y(tv), y2: y(tv), stroke: css("--grid"), "stroke-width": 1 }, svg);
    const t = el("text", { x: L - 9, y: y(tv) + 4, "text-anchor": "end", "font-size": 11, "font-family": css("--font-data"), fill: css("--muted") }, svg);
    t.textContent = nf(tv, 0) + sufixo;
  });

  const labels = P.map((p, i) => {
    const t = el("text", { x: cx(i), y: H - 10, "text-anchor": "middle", "font-size": 12, fill: css("--muted") }, svg);
    t.textContent = p;
    return t;
  });

  const grupos = {};
  (g.series || []).forEach(s => {
    const grp = el("g", { class: "serie", "data-key": s.chave }, svg);
    grupos[s.chave] = grp;
    const casas = s.casas ?? 1;

    if (g.tipo === "barras") {
      const bw = Math.min(50, cw * 0.42);
      s.valores.forEach((v, i) => {
        if (v == null) return;
        const r = el("rect", { x: cx(i) - bw / 2, y: y(v), width: bw, height: Math.max(0, (H - B) - y(v)), rx: 4,
          fill: css(s.cor + "-soft") || css("--accent-soft"), stroke: css(s.cor), "stroke-width": 1, class: "grow" }, grp);
        if (!reduce) { r.style.transform = "scaleY(0)"; r.style.transformOrigin = `0px ${H - B}px`; }
        const lab = el("text", { x: cx(i), y: y(v) - 7, "text-anchor": "middle", "font-size": 11, "font-weight": 500,
          "font-family": css("--font-data"), fill: css("--fg"), class: "fade" }, grp);
        lab.textContent = fmtV(v, casas, sufixo);
        if (!reduce) lab.style.opacity = "0";
      });
      return;
    }

    const pts = s.valores.map((v, i) => v == null ? null : [cx(i), y(v)]).filter(Boolean);
    if (!pts.length) return;
    if (s.area) {
      const d = `M${pts[0][0]},${H - B} ` + pts.map(p => `L${p[0]},${p[1]}`).join(" ") + ` L${pts[pts.length - 1][0]},${H - B} Z`;
      const a = el("path", { d, fill: css(s.cor), opacity: .13, class: "fade" }, grp);
      if (!reduce) { a.style.opacity = "0"; requestAnimationFrame(() => { a.style.opacity = ".13"; }); }
    }
    const path = el("path", { d: "M" + pts.map(p => `${p[0]},${p[1]}`).join(" L"), fill: "none", stroke: css(s.cor),
      "stroke-width": 2, "stroke-linecap": "round", "stroke-linejoin": "round", class: "draw" }, grp);
    if (s.tracejado) path.setAttribute("stroke-dasharray", s.tracejado);
    else if (!reduce) {
      const len = path.getTotalLength();
      path.style.strokeDasharray = len; path.style.strokeDashoffset = len;
      requestAnimationFrame(() => { path.style.strokeDashoffset = "0"; });
    }
    pts.forEach((p, i) => {
      if (s.marcador === "quadrado") el("rect", { x: p[0] - 4, y: p[1] - 4, width: 8, height: 8, rx: 1.5, fill: css(s.cor), stroke: css("--surface"), "stroke-width": 2, class: "fade" }, grp);
      else el("circle", { cx: p[0], cy: p[1], r: 4.5, fill: css(s.cor), stroke: css("--surface"), "stroke-width": 2, class: "fade" }, grp);
      const vl = el("text", { x: p[0], y: p[1] - 11, "text-anchor": "middle", "font-size": 11, "font-weight": 500,
        "font-family": css("--font-data"), fill: css("--fg"), class: "fade" }, grp);
      vl.textContent = fmtV(s.valores.filter(x => x != null)[i], s.casas ?? 1, sufixo);
      if (!reduce) vl.style.opacity = "0";
    });
    if (s.curto) {
      const last = pts[pts.length - 1];
      const dl = el("text", { x: last[0] + 11, y: last[1] + 4, "text-anchor": "start", "font-size": 11, "font-weight": 600,
        "font-family": css("--font-data"), fill: css(s.cor), class: "fade" }, grp);
      dl.textContent = s.curto;
      if (!reduce) dl.style.opacity = "0";
    }
  });

  const cross = el("line", { y1: T, y2: H - B, class: "crosshair" }, svg);
  const tip = node("div", "tip", "", box);

  P.forEach((p, i) => {
    const r = el("rect", { x: L + cw * i, y: T, width: cw, height: H - T - B, class: "hit" }, svg);
    const mostrar = () => {
      cross.setAttribute("x1", cx(i)); cross.setAttribute("x2", cx(i)); cross.classList.add("on");
      const linhas = (g.series || []).map(s => s.valores[i] == null ? null :
        `<span class="k">${s.curto || s.nome}</span> ${fmtV(s.valores[i], s.casas ?? 1, sufixo)}`).filter(Boolean);
      tip.innerHTML = `<b>${p}</b><br>` + linhas.join("<br>");
      const ratio = box.clientWidth / W;
      tip.style.left = (cx(i) * ratio) + "px";
      tip.style.top = ((T + 6) * ratio) + "px";
      tip.classList.add("on");
    };
    r.addEventListener("pointerenter", mostrar);
    r.addEventListener("pointermove", mostrar);
    r.addEventListener("pointerleave", () => { cross.classList.remove("on"); tip.classList.remove("on"); });
    r.addEventListener("click", () => setSel(i));
  });

  box.addEventListener("keydown", e => {
    if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
    e.preventDefault();
    const cur = typeof sel === "number" ? sel : 0;
    setSel(Math.min(P.length - 1, Math.max(0, cur + (e.key === "ArrowRight" ? 1 : -1))));
  });

  const api = {
    update() {
      if (typeof sel !== "number") selRect.style.opacity = "0";
      else {
        selRect.style.opacity = "";
        selRect.setAttribute("transform", `translate(${L + cw * sel + 4} 0)`);
      }
      labels.forEach((t, k) => {
        const on = k === sel;
        t.setAttribute("font-weight", on ? 700 : 400);
        t.setAttribute("fill", on ? css("--fg") : css("--muted"));
      });
    },
    toggle(key, on) { if (grupos[key]) grupos[key].dataset.off = on ? "0" : "1"; }
  };
  charts.push(api);
  requestAnimationFrame(() => {
    svg.querySelectorAll(".grow").forEach(r => { r.style.transform = "scaleY(1)"; });
    svg.querySelectorAll(".fade").forEach(r => { r.style.opacity = r.tagName === "path" ? ".13" : "1"; });
  });
  return api;
}

/* ---------- dumbbell ---------- */
function dumbbell(box, g) {
  const W = 520, H = 60 + g.series.length * 62, L = 54, R = 70, T = 18, B = 34;
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, "aria-hidden": "true" }, box);
  const x = v => L + (W - L - R) * (v - g.min) / (g.max - g.min);
  const ry = i => T + 34 + i * 62;
  const casas = g.casas ?? 2, sufixo = g.sufixo ?? "%";

  g.ticks.forEach(tv => {
    el("line", { x1: x(tv), x2: x(tv), y1: T, y2: H - B, stroke: css("--grid"), "stroke-width": 1 }, svg);
    const t = el("text", { x: x(tv), y: H - B + 16, "text-anchor": "middle", "font-size": 11, "font-family": css("--font-data"), fill: css("--muted") }, svg);
    t.textContent = nf(tv, 0) + sufixo;
  });
  const leg = el("text", { x: L, y: T, "font-size": 11, fill: css("--muted") }, svg);
  leg.textContent = `${g.pontos[0]} (vazado) → ${g.pontos[1]} (cheio)`;
  const tip = node("div", "tip", "", box);

  g.series.forEach((s, i) => {
    const grp = el("g", { class: "serie", "data-key": s.chave }, svg);
    const yy = ry(i);
    const rot = el("text", { x: L - 10, y: yy + 4, "text-anchor": "end", "font-size": 12, fill: css("--fg") }, svg);
    rot.textContent = s.nome.split(" (")[0];
    const x0 = x(s.valores[0]), x1 = x(s.valores[1]);
    const conn = el("line", { x1: x0, x2: x0, y1: yy, y2: yy, stroke: css(s.cor), "stroke-width": 3, "stroke-linecap": "round", opacity: .35 }, grp);
    if (reduce) conn.setAttribute("x2", x1);
    else { conn.style.transition = "all .9s var(--ease) .2s"; requestAnimationFrame(() => conn.setAttribute("x2", x1)); }

    [0, 1].forEach(k => {
      const cxv = x(s.valores[k]);
      const nd = s.marcador === "quadrado"
        ? el("rect", { x: cxv - 6, y: yy - 6, width: 12, height: 12, rx: 2, fill: k ? css(s.cor) : css("--surface"), stroke: css(s.cor), "stroke-width": 2.5, class: "fade" }, grp)
        : el("circle", { cx: cxv, cy: yy, r: 6.5, fill: k ? css(s.cor) : css("--surface"), stroke: css(s.cor), "stroke-width": 2.5, class: "fade" }, grp);
      if (!reduce) nd.style.opacity = "0";
      const hit = el("circle", { cx: cxv, cy: yy, r: 16, class: "hit" }, grp);
      hit.addEventListener("pointerenter", () => {
        tip.innerHTML = `<b>${s.nome.split(" (")[0]} · ${g.pontos[k]}</b><br>${fmtV(s.valores[k], casas, sufixo)}`;
        const ratio = box.clientWidth / W;
        tip.style.left = (cxv * ratio) + "px"; tip.style.top = ((yy - 10) * ratio) + "px";
        tip.classList.add("on");
      });
      hit.addEventListener("pointerleave", () => tip.classList.remove("on"));
    });

    const ini = el("text", { x: x0 - 13, y: yy + 4, "text-anchor": "end", "font-size": 11, "font-weight": 500, "font-family": css("--font-data"), fill: css("--muted"), class: "fade" }, grp);
    ini.textContent = fmtV(s.valores[0], casas, sufixo);
    const fim = el("text", { x: x1 + 14, y: yy + 4, "font-size": 11.5, "font-weight": 600, "font-family": css("--font-data"), fill: css(s.cor), class: "fade" }, grp);
    fim.textContent = fmtV(s.valores[1], casas, sufixo);
    if (!reduce) { ini.style.opacity = "0"; fim.style.opacity = "0"; }

    const dif = s.valores[1] - s.valores[0];
    const gl = el("text", { x: L - 10, y: yy + 19, "text-anchor": "end", "font-size": 11, "font-family": css("--font-data"), fill: css("--muted") }, svg);
    gl.textContent = (dif > 0 ? "+" : "") + nf(dif, casas) + " pp";
  });

  requestAnimationFrame(() => svg.querySelectorAll(".fade").forEach(n => { n.style.opacity = "1"; }));
  return { update() {}, toggle(key, on) { const grp = svg.querySelector(`[data-key="${key}"]`); if (grp) grp.dataset.off = on ? "0" : "1"; } };
}

/* ---------- painéis ---------- */
const raiz = document.getElementById("paineis");
DADOS.paineis.forEach((painel, idx) => {
  const art = node("article", "panel" + (painel.largura === "full" ? " full" : ""), "", raiz);
  const ph = node("div", "ph", `<h2>${painel.titulo}</h2>` + (painel.total ? `<span class="tot">${painel.total}</span>` : ""), art);
  if (painel.aviso) node("div", "flag", `<b>${painel.aviso.titulo}</b><span>${painel.aviso.texto}</span>`, art);

  const legendaBox = node("div", "legend", "", art);
  const apis = [];
  const graficos = painel.grafico ? [painel.grafico] : (painel.graficos || []);

  graficos.forEach(g => {
    const box = node("div", "chart", "", art);
    box.tabIndex = 0;
    box.setAttribute("role", g.tipo === "dumbbell" ? "img" : "application");
    box.setAttribute("aria-label", g.descricao || painel.titulo);
    apis.push(g.tipo === "dumbbell" ? dumbbell(box, g) : periodChart(box, g, painel));
  });

  const todas = graficos.flatMap(g => g.series || []);
  if (todas.length > 1 || graficos.some(g => g.tipo === "dumbbell")) {
    legendaBox.innerHTML = todas.map(s =>
      `<button type="button" data-key="${s.chave}" aria-pressed="true"><span class="swatch${s.marcador === "circulo" ? " ring" : ""}" style="background:var(${s.cor})"></span>${s.nome}</button>`).join("");
    legendaBox.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
      const on = b.getAttribute("aria-pressed") === "false";
      b.setAttribute("aria-pressed", String(on));
      apis.forEach(a => a.toggle(b.dataset.key, on));
    }));
  } else legendaBox.remove();

  if (painel.ranking) {
    const r = painel.ranking;
    const topo = Math.max(...r.itens.map(i => i.valor));
    const st = node("div", "steps", `<div class="eyebrow">${r.titulo}</div>`, art);
    r.itens.forEach(it => {
      node("div", "step",
        `<span>${it.rotulo}</span><div class="bar"><span data-w="${(it.valor / topo * 100).toFixed(1)}"></span></div>` +
        `<span class="n">${fmtV(it.valor, r.casas ?? 1, r.sufixo ?? "")}</span>`, st);
    });
  }

  if (painel.nota) node("p", "note", painel.nota, art);

  const btn = node("button", "tbtn", "Ver tabela", art);
  btn.type = "button"; btn.setAttribute("aria-expanded", "false");
  const tbl = node("div", "tbl", "", art);
  tbl.hidden = true;

  const dum = graficos.find(g => g.tipo === "dumbbell");
  if (dum) {
    tbl.innerHTML = `<table><thead><tr><th>Série</th><th class="num">${dum.pontos[0]}</th><th class="num">${dum.pontos[1]}</th></tr></thead><tbody>` +
      dum.series.map(s => `<tr><td>${s.nome}</td><td class="num">${fmtV(s.valores[0], dum.casas ?? 2, dum.sufixo ?? "%")}</td><td class="num">${fmtV(s.valores[1], dum.casas ?? 2, dum.sufixo ?? "%")}</td></tr>`).join("") +
      `</tbody></table>`;
  } else if (todas.length) {
    const suf = painel.sufixo ?? "";
    tbl.innerHTML = `<table><thead><tr><th>Período</th>` + todas.map(s => `<th class="num">${s.nome}</th>`).join("") + `</tr></thead><tbody>` +
      P.map((p, i) => `<tr><td>${p}</td>` + todas.map(s => `<td class="num">${s.valores[i] == null ? "—" : fmtV(s.valores[i], s.casas ?? 1, graficos.find(g => (g.series || []).includes(s))?.sufixo ?? suf)}</td>`).join("") + `</tr>`).join("") +
      `</tbody></table>`;
  }
  btn.addEventListener("click", () => {
    const abrir = tbl.hidden;
    tbl.hidden = !abrir;
    btn.setAttribute("aria-expanded", String(abrir));
    btn.textContent = abrir ? "Ocultar tabela" : "Ver tabela";
  });
});

document.getElementById("rodape").innerHTML = DADOS.rodape.map(t => `<span>${t}</span>`).join("");

/* ---------- seleção ---------- */
function movePill() {
  const btn = seg.querySelector('button[aria-pressed="true"]');
  const pill = document.getElementById("pill");
  if (!btn) return;
  pill.style.width = btn.offsetWidth + "px";
  pill.style.transform = `translateX(${btn.offsetLeft - 3}px)`;
}
function setSel(v) {
  sel = v;
  seg.querySelectorAll("button").forEach(b => {
    const m = b.dataset.m === "q" ? "q" : +b.dataset.m;
    b.setAttribute("aria-pressed", String(m === sel));
  });
  try { localStorage.setItem("dash-periodo", String(v)); } catch (e) {}
  movePill(); kpis(); charts.forEach(c => c.update());
}
seg.querySelectorAll("button").forEach(b => b.addEventListener("click", () => setSel(b.dataset.m === "q" ? "q" : +b.dataset.m)));

try {
  const s = localStorage.getItem("dash-periodo");
  if (s != null) sel = s === "q" ? "q" : +s;
} catch (e) {}

document.querySelectorAll(".step .bar span").forEach(s => requestAnimationFrame(() => { s.style.width = s.dataset.w + "%"; }));
setSel(sel);
window.addEventListener("resize", movePill);
document.fonts && document.fonts.ready.then(movePill);
</script>
